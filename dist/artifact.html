<title>Give or Take</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Give or Take -- committed dark, mobile-first. */

:root {
  --ground: #0E1116;
  --surface: #171C24;
  --surface-2: #1F2631;
  --ink: #F0E9DC;
  --ink-soft: #C4BCAB;
  --muted: #B3AC9D;
  --rule: #2A313D;
  --over: #4FC0A8;
  --under: #F4988A;
  --brass: #E3B25B;

  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;

  --pad: clamp(1rem, 5vw, 1.5rem);
  --tap: 60px;
}

* { box-sizing: border-box; }

/* Author display rules beat the UA's [hidden] rule, so state it outright.
   Without this, .sheet keeps its display:flex while hidden and goes on
   swallowing every tap aimed at the answer buttons behind it. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 19px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* ---------- shell ---------- */

.app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

.screen { display: none; flex: 1 1 auto; flex-direction: column; min-height: 0; }
.screen.on { display: flex; }

/* Home, results and research scroll. The question screen never does. */
.scrollable {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad)
           calc(var(--pad) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* ---------- home ---------- */

.home-head { display: flex; flex-direction: column; gap: 0.5rem; }

.kicker {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.wordmark {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3rem, 15vw, 4.25rem);
  line-height: 0.94;
  letter-spacing: -0.02em;
}

.wordmark .amp { color: var(--brass); font-style: italic; }

.tagline { margin: 0.25rem 0 0; color: var(--ink-soft); font-size: 1rem; max-width: 30ch; }

.cats { display: flex; flex-direction: column; gap: 0.75rem; }

/* ---------- mode chooser ---------- */

.modes { display: flex; flex-direction: column; gap: 0.75rem; }

.mode-btn {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--over);
  border-radius: 4px;
  padding: 1.1rem 1.15rem;
  min-height: var(--tap);
  transition: background 0.15s, transform 0.1s;
}

.mode-btn:active { background: var(--surface-2); transform: scale(0.99); }
.mode-btn + .mode-btn { border-left-color: var(--brass); }
.mode-name { font-family: var(--display); font-size: 1.5rem; line-height: 1.1; }
.mode-sub { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.45; }

/* ---------- setting up a table ---------- */

.players { display: flex; flex-direction: column; gap: 0.5rem; }

.player-row {
  display: grid;
  grid-template-columns: 1.75rem 1fr 44px;
  gap: 0.6rem;
  align-items: center;
}

.player-n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }

.name-input {
  min-height: 52px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.05rem;
  padding: 0.5rem 0.8rem;
  width: 100%;
}

.name-input::placeholder { color: var(--muted); }

.drop-btn {
  width: 44px; height: 44px;
  background: none; border: 0;
  color: var(--muted); font-size: 1.3rem;
  border-radius: 50%;
}

/* ---------- handoff ---------- */

#screen-handoff .scrollable { justify-content: center; text-align: center; gap: 0.9rem; }

.handoff-to {
  font-family: var(--display);
  font-size: clamp(2.8rem, 15vw, 4rem);
  line-height: 1;
  color: var(--brass);
}

.handoff-sub { color: var(--ink-soft); font-size: 1rem; }

/* ---------- stakes ---------- */

.stake-label {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}

.stakes { display: flex; gap: 6px; }

.stake {
  flex: 1 1 0;
  min-height: 46px;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--muted);
}

.stake.on { border-color: var(--brass); color: var(--brass); background: rgba(227,178,91,0.08); }
.stake:active { transform: scale(0.97); }

/* ---------- standings ---------- */

.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.standings li {
  display: grid;
  grid-template-columns: 1.75rem 1fr auto;
  gap: 0.8rem;
  align-items: baseline;
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--rule);
}

.standings .pos { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
.standings .who { font-family: var(--display); font-size: 1.45rem; }
.standings .pts { font-family: var(--mono); font-size: 1.05rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.standings li.lead .who { color: var(--brass); }
.standings li.lead .pos::after { content: " \2605"; color: var(--brass); }


.era-head {
  margin: 1rem 0 0;
  padding-bottom: 0.45rem;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brass);
}

.era-head:first-child { margin-top: 0; }

.cat {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--brass);
  border-radius: 4px;
  padding: 1rem 1.1rem;
  transition: background 0.15s, transform 0.1s;
}

.cat:active { background: var(--surface-2); transform: scale(0.99); }

.cat-era {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.cat-title { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; }
.cat-blurb { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.45; }

.cat-meta {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
  display: flex;
  gap: 0.9rem;
  padding-top: 0.2rem;
}

.cat-meta b { color: var(--brass); font-weight: 500; }

.home-foot {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  border-top: 1px solid var(--rule);
  padding-top: 1.1rem;
}

.switch { display: flex; align-items: center; gap: 0.65rem; font-size: 0.95rem; color: var(--ink-soft); }
.switch input { width: 22px; height: 22px; accent-color: var(--over); }

.link-btn {
  background: none;
  border: 0;
  padding: 0.4rem 0;
  text-align: left;
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--brass);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.note { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }

/* ---------- play ---------- */

.topbar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 0.75rem;
  padding: calc(0.5rem + env(safe-area-inset-top)) var(--pad) 0.5rem;
}

.icon-btn {
  width: 44px; height: 44px;
  background: none; border: 0;
  font-size: 1.6rem; line-height: 1;
  color: var(--muted);
  border-radius: 50%;
}

.dots { display: flex; gap: 5px; justify-content: center; }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--rule);
  transition: background 0.2s, transform 0.2s;
}

.dot.now { background: var(--ink-soft); transform: scale(1.5); }
.dot.hit { background: var(--over); }
.dot.miss { background: var(--under); }
.dot.part { background: var(--brass); }

.score {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.82rem;
  color: var(--muted);
  min-width: 3.5ch;
  text-align: right;
}

.stage {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.7rem;
  padding: 0.5rem var(--pad);
  text-align: center;
}

.band {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.stem {
  margin: 0;
  font-size: clamp(1.15rem, 5.2vw, 1.5rem);
  line-height: 1.32;
  text-wrap: pretty;
}

.big {
  margin: 0.1rem 0;
  font-family: var(--display);
  font-size: clamp(3.2rem, 17vw, 5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--brass);
  font-variant-numeric: tabular-nums;
}

.big.small { font-size: clamp(2rem, 9vw, 2.75rem); }

.ask {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.room-btn {
  min-height: 46px;
  background: none;
  border: 1px dashed var(--rule);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.room-btn:active { background: var(--surface); }
.room-btn[disabled] { opacity: 0.35; }

.bank { font-family: var(--mono); font-size: 0.78rem; color: var(--brass); }

.actions {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0.5rem var(--pad) calc(0.75rem + env(safe-area-inset-bottom));
}

.row { display: flex; gap: 8px; }
.row > * { flex: 1 1 0; }

.ans {
  min-height: var(--tap);
  padding: 0.7rem 0.9rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-size: 1.05rem;
  font-weight: 500;
  line-height: 1.25;
  transition: background 0.12s, transform 0.08s, border-color 0.12s;
}

.ans:active { transform: scale(0.98); background: var(--surface-2); }
.ans.under { border-color: rgba(244,152,138,0.45); color: var(--under); }
.ans.over  { border-color: rgba(79,192,168,0.45); color: var(--over); }
.ans.claim { font-family: var(--body); font-size: 0.95rem; font-weight: 400; text-align: left; }
.ans.wide { flex: 1 1 100%; }
.ans.brass { border-color: rgba(227,178,91,0.5); color: var(--brass); }
.ans[disabled] { opacity: 0.45; }

/* ---------- reveal sheet ---------- */

.sheet-back {
  position: fixed; inset: 0;
  background: rgba(8,10,14,0.72);
  z-index: 20;
}

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 21;
  max-height: 82dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--surface);
  border-top: 3px solid var(--rule);
  border-radius: 14px 14px 0 0;
  padding: 1.25rem var(--pad) calc(1rem + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }

.verdict {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.verdict.good { color: var(--over); }
.verdict.bad { color: var(--under); }
.verdict.part { color: var(--brass); }
.verdict .pts { color: var(--brass); font-variant-numeric: tabular-nums; }

.truth { display: flex; flex-direction: column; gap: 0.15rem; }
.truth-claim { font-size: 0.95rem; color: var(--ink-soft); }
.truth-val {
  font-family: var(--display);
  font-size: clamp(2.2rem, 11vw, 3rem);
  line-height: 1.05;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.sheet p { margin: 0; }
.context { font-size: 0.95rem; line-height: 1.5; }

.deeper {
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--ink-soft);
  border-left: 2px solid var(--brass);
  padding-left: 0.8rem;
}

.deeper b {
  display: block;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 500;
  margin-bottom: 0.25rem;
}

.sheet-links { display: flex; gap: 8px; }

.sheet-links a, .save-btn {
  flex: 1 1 0;
  min-height: 50px;
  display: flex; align-items: center; justify-content: center;
  gap: 0.4rem;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.76rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: none;
  text-align: center;
  padding: 0.5rem;
}

.save-btn.saved { color: var(--brass); border-color: rgba(227,178,91,0.5); }

.anchor {
  font-size: 0.92rem;
  color: var(--muted);
  border-left: 2px solid var(--rule);
  padding-left: 0.7rem;
}

.next-btn {
  min-height: var(--tap);
  background: var(--ink);
  color: var(--ground);
  border: 0;
  border-radius: 6px;
  font-size: 1.05rem;
  font-weight: 600;
}

.next-btn:active { transform: scale(0.98); }

.draft-flag {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}

/* ---------- results ---------- */

.res-head { display: flex; flex-direction: column; gap: 0.3rem; }
.res-score {
  font-family: var(--display);
  font-size: clamp(3.5rem, 20vw, 5rem);
  line-height: 0.95;
  color: var(--brass);
  font-variant-numeric: tabular-nums;
}
.res-sub { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; }
.res-best { font-size: 0.95rem; color: var(--over); }

h2.sec {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.rlist { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }

.rlist li {
  display: grid;
  grid-template-columns: 1.5rem 1fr auto;
  gap: 0.7rem;
  align-items: start;
  padding: 0.7rem 0;
  border-bottom: 1px solid var(--rule);
  font-size: 0.9rem;
}

.mark { font-family: var(--mono); font-size: 0.9rem; }
.mark.good { color: var(--over); }
.mark.bad { color: var(--under); }
.mark.part { color: var(--brass); }

.rlist .rc { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.rlist .rv { font-family: var(--mono); font-size: 0.78rem; color: var(--brass); }
.rlist a { color: var(--ink-soft); font-family: var(--mono); font-size: 0.7rem; text-decoration: underline; }

.stack { display: flex; flex-direction: column; gap: 8px; }

/* ---------- research ---------- */

.res-empty { color: var(--ink-soft); font-size: 0.95rem; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

</style>
<div class="app">

  <section class="screen on" id="screen-home">
    <div class="scrollable">
      <header class="home-head">
        <p class="kicker">A Kirk Ogren game</p>

        <p class="tagline">Pick a period you care about. Ten easy questions. Nobody needs the exact year.</p>
      </header>

      <div class="modes">
        <button class="mode-btn" id="mode-solo" type="button">
          <span class="mode-name">Play on your own</span>
          <span class="mode-sub">One period, ten questions, about three minutes. Works with no signal.</span>
        </button>
        <button class="mode-btn" id="mode-together" type="button">
          <span class="mode-name">Play together</span>
          <span class="mode-sub">Two to six people, one phone. Everyone picks a period and takes turns.</span>
        </button>
      </div>

      <div class="home-foot">
        <label class="switch">
          <input type="checkbox" id="gentle">
          <span>Gentler questions</span>
        </label>
        <p class="bank" id="bank">0 points banked</p>
        <button class="link-btn" id="open-research" type="button">Research list &middot; <span id="res-count">0</span> saved</button>
        <p class="note">Prototype. These facts are unreviewed drafts with a source on every one &mdash; check them before trusting them.</p>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-setup"><div class="scrollable" id="setup-body"></div></section>
  <section class="screen" id="screen-pick"><div class="scrollable" id="pick-body"></div></section>
  <section class="screen" id="screen-handoff"><div class="scrollable" id="handoff-body"></div></section>

  <section class="screen" id="screen-play">
    <div class="topbar">
      <button class="icon-btn" id="quit" type="button" aria-label="Leave this game">&times;</button>
      <div class="dots" id="dots"></div>
      <div class="score" id="score" aria-label="Score">0</div>
    </div>

    <div class="stage">
      <p class="band" id="band"></p>
      <p class="stem" id="stem"></p>
      <p class="big" id="big" hidden></p>
      <p class="ask" id="ask"></p>
    </div>

    <div class="actions" id="actions"></div>
  </section>

  <section class="screen" id="screen-standings"><div class="scrollable" id="standings-body"></div></section>
  <section class="screen" id="screen-results"><div class="scrollable" id="results-body"></div></section>
  <section class="screen" id="screen-research"><div class="scrollable" id="research-body"></div></section>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-live="polite"></div>

ects found on Viking-age sites.","source":{"title":"Vikings","url":"https://en.wikipedia.org/wiki/Vikings"},"status":"draft"}],"ancient-rome":[{"id":"ro-founded","kind":"year","claim":"Rome was founded, according to Roman tradition","value":-753,"approx":true,"context":"Tradition put the founding at 753 BC and credited it to Romulus. The date is legendary rather than documented, and there were villages on the hills before it.","goDeeper":"Romans numbered their years from that date: AUC, ab urbe condita, 'from the founding of the city'.","source":{"title":"Founding of Rome","url":"https://en.wikipedia.org/wiki/Founding_of_Rome"},"status":"draft","fame":"familiar"},{"id":"ro-republic-founded","kind":"year","claim":"Romans threw out their last king and founded the Republic","value":-509,"approx":true,"context":"The overthrow of Tarquin the Proud is traditionally dated to 509 BC. Like the founding, the date is traditional and historians treat it with caution.","goDeeper":"The Republic ran for roughly 480 years before Augustus, nearly twice as long as the United States has existed so far.","source":{"title":"Roman Republic","url":"https://en.wikipedia.org/wiki/Roman_Republic"},"status":"draft","fame":"obscure"},{"id":"ro-hannibal-alps","kind":"year","claim":"Hannibal marched an army with elephants over the Alps into Italy","value":-218,"context":"He crossed in 218 BC at the start of the Second Punic War and beat Roman armies in Italy for the next fifteen years without ever taking the city.","goDeeper":"He set out with about 37 elephants. Almost none of them survived their first winter in Italy.","source":{"title":"Hannibal","url":"https://en.wikipedia.org/wiki/Hannibal"},"status":"draft","fame":"familiar"},{"id":"ro-rubicon","kind":"year","claim":"Caesar crossed the Rubicon with his army and began a civil war","value":-49,"context":"In January 49 BC he led a legion across the small river marking the northern edge of Italy, which no general was permitted to do under arms. eeper":"Its actual name was the Flavian Amphitheatre. 'Colosseum' came from the colossal bronze statue of Nero that stood beside it.","source":{"title":"Colosseum","url":"https://en.wikipedia.org/wiki/Colosseum"},"status":"draft","fame":"familiar"},{"id":"ro-hadrians-wall","kind":"year","claim":"Work began on Hadrian's Wall across northern Britain","value":122,"approx":true,"context":"Building started around AD 122 on the emperor Hadrian's orders and took roughly six years. The exact start year is an estimate.","goDeeper":"It ran 73 miles from coast to coast, and it was not the frontier for long: a second wall went up further north twenty years later.","source":{"title":"Hadrian's Wall","url":"https://en.wikipedia.org/wiki/Hadrian%27s_Wall"},"status":"draft","fame":"obscure"},{"id":"ro-christianity-legal","kind":"year","claim":"Constantine's Edict of Milan made Christianity legal across the empire","value":313,"context":"The agreement of AD 313 ended official persecution and granted freedom of worship to Christians and to everyone else.","goDeeper":"Christianity did not become the official religion of the empire until AD 380, under Theodosius, nearly seventy years later.","source":{"title":"Edict of Milan","url":"https://en.wikipedia.org/wiki/Edict_of_Milan"},"status":"draft","fame":"obscure"},{"id":"ro-sack-of-rome","kind":"year","claim":"The Visigoths under Alaric sacked the city of Rome","value":410,"context":"Rome was entered and looted over three days in August AD 410, the first time a foreign army had got inside the city in 800 years.","goDeeper":"Rome was not even the capital by then. The western emperor was sitting safely behind the marshes at Ravenna while it happened.","source":{"title":"Sack of Rome (410)","url":"https://en.wikipedia.org/wiki/Sack_of_Rome_(410)"},"status":"draft","fame":"obscure"},{"id":"ro-western-empire-ends","kind":"year","claim":"The last emperor in the west was deposed, the traditional end of the Roman Empire","value":476,"context":" n in the British Museum since 1802.","source":{"title":"Rosetta Stone","url":"https://en.wikipedia.org/wiki/Rosetta_Stone"},"status":"draft"},{"id":"eg-hieroglyphs-deciphered","kind":"year","claim":"Champollion cracked the hieroglyphic script","value":1822,"context":"Jean-Francois Champollion announced his breakthrough in 1822, 23 years after the Rosetta Stone was found.","goDeeper":"Nobody had been able to read hieroglyphs for roughly 1,400 years. An entire civilisation's writing had gone silent.","source":{"title":"Jean-Francois Champollion","url":"https://en.wikipedia.org/wiki/Jean-Fran%C3%A7ois_Champollion"},"status":"draft"},{"id":"eg-cleopatra-died","kind":"year","claim":"Cleopatra died, ending three thousand years of pharaohs","value":-30,"context":"She died in 30 BC after Octavian's forces took Alexandria. Egypt became a Roman province.","goDeeper":"She was the last ruler of the Ptolemaic dynasty, and reportedly the first of them in three centuries who bothered to learn Egyptian.","source":{"title":"Cleopatra","url":"https://en.wikipedia.org/wiki/Cleopatra"},"status":"draft"},{"id":"eg-pyramid-height","kind":"number","claim":"Original height of the Great Pyramid","value":146,"unit":"metres","approx":true,"context":"About 146 metres when finished, roughly 480 feet. Erosion and the loss of its outer casing have taken some metres off.","goDeeper":"The base is level to within a couple of centimetres across more than five acres, achieved without a single modern instrument.","source":{"title":"Great Pyramid of Giza","url":"https://en.wikipedia.org/wiki/Great_Pyramid_of_Giza"},"status":"draft"},{"id":"eg-ramesses-reign","kind":"number","claim":"Length of the reign of Ramesses II","value":66,"unit":"years","context":"He ruled for about 66 years in the 13th century BC and lived into his ninetieth year.","goDeeper":"He outlived twelve of his own sons. By the end of his reign, most Egyptians alive had never known another pharaoh.","source":{"title":"Ramesses II","url": ":{"title":"Alexander the Great","url":"https://en.wikipedia.org/wiki/Alexander_the_Great"},"status":"draft"},{"id":"gr-corinth","kind":"year","claim":"Rome sacked Corinth, ending Greek independence","value":-146,"context":"The destruction of Corinth in 146 BC brought Greece firmly under Roman control.","goDeeper":"The Romans absorbed Greek art, religion and philosophy so thoroughly that Horace said captive Greece took Rome captive.","source":{"title":"Battle of Corinth (146 BC)","url":"https://en.wikipedia.org/wiki/Battle_of_Corinth_(146_BC)"},"status":"draft"},{"id":"gr-city-states","kind":"number","claim":"Number of independent Greek city-states at their height","value":1000,"unit":"city-states","approx":true,"context":"Around a thousand poleis are known across the Greek world, most of them tiny.","goDeeper":"They shared a language and gods but fought each other constantly. Unity came only under outside conquest.","source":{"title":"Polis","url":"https://en.wikipedia.org/wiki/Polis"},"status":"draft"},{"id":"gr-parthenon-columns","kind":"number","claim":"Columns along the long side of the Parthenon","value":17,"unit":"columns","context":"Seventeen along each flank and eight across each end.","goDeeper":"Almost no line in the building is truly straight; the columns bulge and lean inward to correct for how the eye sees them.","source":{"title":"Parthenon","url":"https://en.wikipedia.org/wiki/Parthenon"},"status":"draft"},{"id":"gr-athens-population","kind":"number","claim":"Estimated population of Athens at its fifth-century peak","value":300000,"unit":"people","approx":true,"context":"Perhaps 250,000 to 300,000 in Athens and Attica, of whom around 30,000 to 40,000 were voting citizens.","goDeeper":"A large share of the population was enslaved, and the silver mines that funded the fleet were worked by them.","source":{"title":"Classical Athens","url":"https://en.wikipedia.org/wiki/Classical_Athens"},"status":"draft"},{"id":"gr-theatre-capacity","kind":"number","cla :"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-deaths","kind":"number","claim":"Estimated deaths in the eruption of Vesuvius","value":2000,"unit":"deaths","approx":true,"sensitive":true,"context":"Around 2,000 bodies have been found at Pompeii, though the true toll across the region was likely higher.","goDeeper":"Many residents had fled during the earlier stages; those who stayed were killed by the surges of hot gas.","source":{"title":"Eruption of Mount Vesuvius in 79 AD","url":"https://en.wikipedia.org/wiki/Eruption_of_Mount_Vesuvius_in_79_AD"},"status":"draft"},{"id":"pm-population","kind":"number","claim":"Estimated population of Pompeii before the eruption","value":11000,"unit":"people","approx":true,"context":"Estimates run from about 11,000 to 15,000 for the town at its height.","goDeeper":"It was a prosperous provincial port, not a great city — which is partly why the ordinary detail survives.","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-ash-depth","kind":"number","claim":"Depth of ash and pumice that buried Pompeii","value":5,"unit":"metres","approx":true,"context":"Roughly four to six metres of volcanic debris covered the town.","goDeeper":"Herculaneum was buried far deeper, under about 20 metres of hot mud and ash, which preserved wood and even food.","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-column-height","kind":"number","claim":"Height of the eruption column above Vesuvius","value":33,"unit":"kilometres","approx":true,"context":"The column reached roughly 33 km into the stratosphere at its peak.","goDeeper":"Pliny the Younger described it as shaped like an umbrella pine. Eruptions of this type are now called Plinian.","source":{"title":"Eruption of Mount Vesuvius in 79 AD","url":"https://en.wikipedia.org/wiki/Eruption_of_Mount_Vesuvius_in_79_AD"},"status":"draft"},{"id":"pm-earthquake","kind":"y ce":{"title":"Mount Vesuvius","url":"https://en.wikipedia.org/wiki/Mount_Vesuvius"},"status":"draft"},{"id":"pm-pliny-age","kind":"number","claim":"Age of Pliny the Younger when he witnessed the eruption","value":17,"unit":"years old","context":"He was about 17, watching from across the bay at Misenum, and wrote his account decades later.","goDeeper":"His uncle Pliny the Elder sailed towards the eruption to help evacuate people and died in the attempt.","source":{"title":"Pliny the Younger","url":"https://en.wikipedia.org/wiki/Pliny_the_Younger"},"status":"draft"},{"id":"pm-loaves","kind":"boolean","claim":"Carbonised loaves of bread have been recovered from Pompeii and Herculaneum","answer":true,"context":"Bread was found still in the ovens, carbonised but intact, some stamped with the baker's mark.","goDeeper":"One bakery's loaf was scored into eight segments, the same way focaccia is divided in Naples today.","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-graffiti","kind":"boolean","claim":"Thousands of pieces of graffiti survive on Pompeii's walls","answer":true,"context":"More than 11,000 inscriptions have been recorded: election slogans, insults, prices, love notes and jokes.","goDeeper":"One reads: 'I am amazed, wall, that you have not collapsed under the weight of so much writing.'","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-lava","kind":"boolean","claim":"Pompeii was destroyed by flowing lava","answer":false,"context":"There was no lava flow. The town was buried by falling pumice and then struck by pyroclastic surges of scorching gas and ash.","goDeeper":"The surges moved at over 100 km per hour and were hot enough to kill instantly.","source":{"title":"Eruption of Mount Vesuvius in 79 AD","url":"https://en.wikipedia.org/wiki/Eruption_of_Mount_Vesuvius_in_79_AD"},"status":"draft"},{"id":"pm-pliny-elder","kind":"boolean","claim":"Pliny the Elder died during the eruption","answer":true,"context":"He crossed the bay by ship to observe the eruption and rescue survivors, and died on the shore at Stabiae.","goDeeper":"He was the author of the Natural History, a 37-volume encyclopedia of everything then known.","source":{"title":"Pliny the Elder","url":"https://en.wikipedia.org/wiki/Pliny_the_Elder"},"status":"draft"},{"id":"pm-herculaneum-scrolls","kind":"boolean","claim":"A library of scrolls survived carbonised at Herculaneum","answer":true,"context":"Around 1,800 scrolls were found in the Villa of the Papyri, charred solid by the heat.","goDeeper":"They are now being read without unrolling them, using X-ray scanning and machine learning.","source":{"title":"Herculaneum papyri","url":"https://en.wikipedia.org/wiki/Herculaneum_papyri"},"status":"draft"},{"id":"pm-forgotten","kind":"boolean","claim":"The location of Pompeii was completely forgotten for centuries","answer":true,"context":"The site was lost for about 1,500 years, though the local name Civita hinted that something lay beneath.","goDeeper":"It was rediscovered by workmen digging a water channel.","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pompeii"},"status":"draft"},{"id":"pm-fast-food","kind":"boolean","claim":"Pompeii had street counters serving hot food to passers-by","answer":true,"context":"Around 80 thermopolia have been identified, with sunken jars in a masonry counter for serving hot dishes.","goDeeper":"One excavated in 2020 still had traces of duck, goat, fish and snails in its jars.","source":{"title":"Thermopolium","url":"https://en.wikipedia.org/wiki/Thermopolium"},"status":"draft"},{"id":"pm-unesco","kind":"boolean","claim":"Pompeii is a UNESCO World Heritage Site","answer":true,"context":"Inscribed in 1997 along with Herculaneum and Torre Annunziata.","goDeeper":"It is among Italy's most visited sites, which is itself a preservation problem.","source":{"title":"Pompeii","url":"https://en.wikipedia.org/wiki/Pomp
