<div class="app">

  <section class="screen on" id="screen-home">
    <div class="scrollable">
      <header class="home-head">
        <p class="kicker">A Kirk Ogren game</p>
        <h1 class="wordmark">Give<span class="amp"> or </span>Take</h1>
        <p class="tagline">Pick a period you care about. Ten easy questions. Nobody needs the exact year.</p>
      </header>

      <div class="modes">
        <button class="mode-btn" id="mode-solo" type="button">
          <span class="mode-name">Play on your own</span>
          <span class="mode-sub">One period, ten questions, about three minutes. Works with no signal.</span>
        </button>
        <button class="mode-btn" id="mode-together" type="button">
          <span class="mode-name">Play together</span>
          <span class="mode-sub">Two to six people, one phone. Everyone picks a period and takes turns.</span>
        </button>
      </div>

      <div class="home-foot">
        <label class="switch">
          <input type="checkbox" id="gentle">
          <span>Gentler questions</span>
        </label>
        <p class="bank" id="bank">0 points banked</p>
        <button class="link-btn" id="open-research" type="button">Research list &middot; <span id="res-count">0</span> saved</button>
        <p class="note">Prototype. These facts are unreviewed drafts with a source on every one &mdash; check them before trusting them.</p>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-setup"><div class="scrollable" id="setup-body"></div></section>
  <section class="screen" id="screen-pick"><div class="scrollable" id="pick-body"></div></section>
  <section class="screen" id="screen-handoff"><div class="scrollable" id="handoff-body"></div></section>

  <section class="screen" id="screen-play">
    <div class="topbar">
      <button class="icon-btn" id="quit" type="button" aria-label="Leave this game">&times;</button>
      <div class="dots" id="dots"></div>
      <div class="score" id="score" aria-label="Score">0</div>
    </div>

    <div class="stage">
      <p class="band" id="band"></p>
      <p class="stem" id="stem"></p>
      <p class="big" id="big" hidden></p>
      <p class="ask" id="ask"></p>
    </div>

    <div class="actions" id="actions"></div>
  </section>

  <section class="screen" id="screen-standings"><div class="scrollable" id="standings-body"></div></section>
  <section class="screen" id="screen-results"><div class="scrollable" id="results-body"></div></section>
  <section class="screen" id="screen-research"><div class="scrollable" id="research-body"></div></section>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-live="polite"></div>

</div>
